<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <h2>Welcome to Password Checker</h2>
    </div>
    <div class="message"></div>
    <script>
        let actual_pass = 123456;
        for (let i=4; i>=1; i--) {
            let user_pass = parseInt(window.prompt('Please Enter the Password'));
            if (actual_pass===user_pass) {
                document.querySelector('.message').innerHTML='Entered Password is Correct';
                break;
            } else {
                document.querySelector('.message').innerHTML='Wrong Password Entered Please Try Again';
                alert(`${i-1} attempts remaining`);
            }
        }
    </script>
</body>
</html>
